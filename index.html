<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Alexandria is a digital library, utilizing Nostr events for curated publications and wiki pages." />
    <meta name="theme-color" content="#efe6dc" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Alexandria" />
    <title>Library of Alexandria</title>
    <link rel="icon" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Libre+Franklin:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&family=Merriweather:ital,opsz,wght@0,18..144,400;0,18..144,700;1,18..144,400&family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;1,6..12,400&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap"
      rel="stylesheet"
    />
    <meta property="og:title" content="Library of Alexandria" />
    <meta property="og:description" content="Alexandria is a digital library, utilizing Nostr events for curated publications and wiki pages." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Alexandria" />
    <meta property="og:image" content="/screenshots/old_books.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Library of Alexandria" />
    <meta name="twitter:image" content="/screenshots/old_books.jpg" />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('alexandria-appearance');
          if (!raw) return;
          var data = JSON.parse(raw);
          var root = document.documentElement;
          if (data.scheme && data.scheme !== 'antique') {
            root.dataset.theme = data.scheme;
          }
          if (data.dark) root.classList.add('dark');
          if (data.uiFont) root.style.setProperty('--ui-font', data.uiFont);
          if (data.readingFont) root.style.setProperty('--reading-font', data.readingFont);
          var size = Number(data.readingSize);
          if (Number.isFinite(size)) {
            size = Math.min(28, Math.max(14, Math.round(size)));
            root.style.setProperty('--reading-size', size + 'px');
            root.style.setProperty('--ui-size', (size * 16) / 18 + 'px');
          }
          if (data.customPrimary) root.style.setProperty('--brand-primary-500', data.customPrimary);
        } catch (_) {}
      })();
      // Path deep-links → hash routes before the SPA mounts (matches src/lib/path-to-hash.ts).
      (function () {
        try {
          var path = location.pathname || '/';
          if (path === '/' || /\.[a-z0-9]{1,8}$/i.test(path)) return;
          if (!/^\/(search|settings|about|start|contact|p\/|publication\/|wiki\/)/i.test(path)) return;
          path = path.replace(/\/{2,}/g, '/').replace(/\/+$/, '') || '/';
          path = path.replace(
            /^\/(publication|wiki)\/(?:naddr|nevent|note)\/((?:naddr|nevent|note)1[02-9ac-hj-np-z]+)$/i,
            '/$1/$2'
          );
          history.replaceState(null, '', '/' + '#' + path + (location.search || ''));
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
