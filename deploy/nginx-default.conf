server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS — resolve proxy hosts at request time (not boot),
    # so a brief upstream DNS miss cannot keep the SPA from starting.
    resolver 127.0.0.11 valid=30s ipv6=off;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires off;
        try_files $uri =404;
    }

    # Service worker and manifest must not be cached aggressively.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires off;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Seed catalog changes when an export is republished. Do not fall back to index.html.
    location = /seeds/manifest.json {
        default_type application/json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Douay shards and reading plans. Gzip JSON hard; the client caches by ?v=.
    location /seeds/ {
        default_type application/json;
        gzip_types application/json text/plain;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # EPUB/PDF. SPA calls /api/asciidoctor/convert/*; the sidecar serves /convert/*.
    # Variable proxy_pass so nginx does not hard-fail if DNS is down at boot.
    # Requires this container on wikistr-network (service name asciidoctor).
    location /api/asciidoctor/ {
        set $asciidoctor_upstream http://asciidoctor:8091;
        rewrite ^/api/asciidoctor/?(.*)$ /$1 break;
        proxy_pass $asciidoctor_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 32m;
    }

    # Hash-routed SPA: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|ttf|otf|eot|ico|jpg|jpeg|png|gif|svg|webp|webmanifest)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/plain application/javascript application/x-javascript text/javascript text/css application/json image/svg+xml;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
}
