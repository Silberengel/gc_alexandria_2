# Library of Alexandria — production container
# Host: https://gc-alexandria.imwald.eu/  (Apache → 127.0.0.1:9071)
#
# Build/push from a workstation: ./scripts/build-and-push.sh
# Server (pull-only — no local Node/build tools): 
#   docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d

services:
  alexandria:
    image: silberengel/gc-alexandria-2:latest
    container_name: gc-alexandria-2
    restart: unless-stopped
    ports:
      - "127.0.0.1:9071:80"
