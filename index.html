<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Library of Alexandria — a GitCitadel project" />
    <title>Library of Alexandria</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('alexandria-appearance');
          if (!raw) return;
          var data = JSON.parse(raw);
          if (data.scheme) document.documentElement.dataset.theme = data.scheme;
          if (data.dark) document.documentElement.classList.add('dark');
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
